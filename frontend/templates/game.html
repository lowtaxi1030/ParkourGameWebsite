{% extends "base.html" %}
{% block title %}遊戲 - Parkour Studio{% endblock %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}">{% endblock %}
{% block content %}
<h1>遊戲測試區</h1>
<div class="game-toolbar">
    <span id="game-status">載入關卡中……</span>
    <button id="restart-game" type="button">重新開始</button>
</div>
<div class="canvas-wrap"><canvas id="game-canvas" width="960" height="540"></canvas></div>
<p class="hint">操作：A / D 或方向鍵左右移動，W / 上 / Space 跳躍。</p>
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', filename='js/game/game.js') }}"></script>{% endblock %}
