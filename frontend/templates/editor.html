{% extends "base.html" %}
{% block title %}關卡編輯器 - Parkour Studio{% endblock %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/editor.css') }}">{% endblock %}
{% block content %}
<div class="editor-heading">
    <div><h1>關卡編輯器</h1><p>放置平台、尖刺、出生點與終點。</p></div>
    <div class="toolbar">
        <label><input id="show-grid" type="checkbox" checked> 顯示格線</label>
        <label><input id="snap-grid" type="checkbox" checked> 格線吸附</label>
        <label>格子大小 <input id="grid-size" type="number" min="8" max="128" value="32"></label>
        <button id="undo" type="button">復原</button>
        <button id="redo" type="button">重做</button>
        <button id="save-level" type="button">儲存關卡</button>
        <button id="zoom-out" type="button" aria-label="縮小檢視">−</button>
        <span id="zoom-value">100%</span>
        <button id="zoom-in" type="button" aria-label="放大檢視">＋</button>
        <button id="reset-camera" type="button">重置檢視</button>
    </div>
</div>
<div class="editor-controls">
    <label>工具
        <select id="active-tool">
            <option value="select">選取／移動</option>
            <option value="platform">平台</option>
            <option value="spike">尖刺</option>
            <option value="spawn">出生點</option>
            <option value="goal">終點</option>
            <option value="erase">橡皮擦</option>
        </select>
    </label>
    <label>關卡名稱 <input id="level-name" type="text" value="未命名關卡"></label>
    <button id="delete-selected" type="button">刪除選取物件</button>
</div>
<div class="canvas-wrap editor-canvas-wrap">
    <canvas id="editor-canvas" width="960" height="540"></canvas>
</div>
<p class="hint" id="editor-status">拖曳物件可移動；選取工具下拖曳空白處可平移畫面；滾輪縮放，也可按住空白鍵、中鍵或右鍵拖曳平移。</p>
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', filename='js/editor/editor.js') }}"></script>{% endblock %}
