<!doctype html>
<html lang="zh-Hant">

    <title>{% block title %}Parkour Studio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">Parkour Studio</a>
        <nav>
            <a href="/">首頁</a>
            <a href="/levels">關卡</a>
            <a href="/editor">編輯器</a>

    </header>
    <main class="page-content">
        {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}

</html>
